# Integration-test profile. Targets ONLY the dedicated walletdb_test database (never the dev walletdb).
# TestDbGuard aborts the run if the resolved datasource URL is anything else.
spring.datasource.url=jdbc:postgresql://localhost:5432/walletdb_test
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=20
app.admin.password=
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
# Test-only JWT secret (the main application.properties has no default). Not used anywhere else.
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtMDEyMzQ1Njc4OWFiY2RlZi14eHh4
# Test-only: pre-fund new accounts so money tests can start with a balance. The real default is 0
# (see InitialBalanceIT, which runs with the production default overridden back to 0).
app.wallet.initial-balance=100.00
# Flyway clean is allowed only here (the integration-test profile, guarded by TestDbGuard to walletdb_test).
spring.flyway.clean-disabled=false
