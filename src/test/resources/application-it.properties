# Integration-test profile. Targets ONLY the dedicated walletdb_test database (never the dev walletdb).
# TestDbGuard aborts the run if the resolved datasource URL is anything else.
spring.datasource.url=jdbc:postgresql://localhost:5432/walletdb_test
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=20
app.admin.password=
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
