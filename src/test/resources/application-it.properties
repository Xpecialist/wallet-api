# Integration-test profile. Targets ONLY the dedicated walletdb_test database (never the dev walletdb).
# TestDbGuard aborts the run if the resolved datasource URL is anything else.
spring.datasource.url=jdbc:postgresql://localhost:5432/walletdb_test
# Test-only credentials of the local walletdb_test database, stated here on purpose: the main configuration has no default
# user or password. DB_USERNAME / DB_PASSWORD override them.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=20
app.admin.password=
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
# Test-only JWT secret (the main application.properties has no default). Not used anywhere else.
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtMDEyMzQ1Njc4OWFiY2RlZi14eHh4
# Test-only: pre-fund new accounts so money tests can start with a balance. The real default is 0
# (see InitialBalanceIT, which runs with the production default overridden back to 0).
app.wallet.initial-balance=100.00
# Flyway clean is allowed only here (the integration-test profile, guarded by TestDbGuard to walletdb_test).
spring.flyway.clean-disabled=false
# Rate limiting is off for the existing suites (they log in and register far more often than the production limits
# allow from one address); RateLimitIT switches it on with small limits of its own.
app.rate-limit.enabled=false
# Many integration-test contexts stay cached at once, each with its own pool; do not keep 20 idle connections per
# context or the database runs out of connections ("too many clients").
spring.datasource.hikari.minimum-idle=1
