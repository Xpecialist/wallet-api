spring.application.name=wallet-api

spring.datasource.url=jdbc:postgresql://localhost:5432/walletdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# A non-empty database without flyway_schema_history (created by the old schema.sql) is baselined at version 1 instead of
# re-running V1; an EMPTY database always runs V1 in full. SchemaShapeGuard refuses to baseline a database that is not at
# the V1 shape. validate-on-migrate stays on so an edited, already applied migration is detected.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
# "clean" drops everything. Never enable it outside the integration-test profile.
spring.flyway.clean-disabled=true

# Pagination: default page size, and the page size cap applied to the "size" request parameter
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# JWT: secret must be Base64 and at least 32 bytes decoded. There is NO default: the app refuses to start without
# JWT_SECRET. For local development only, start with --spring.profiles.active=dev (application-dev.properties).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000

# Starting balance for new wallets. Real money enters only through the admin deposit endpoint, so this is 0;
# the property exists so tests or a local demo can override it.
app.wallet.initial-balance=0.00
app.wallet.currency=USD

# Deposit requests: most PENDING requests one user may have at a time (spam protection)
app.deposit-requests.max-pending=5

# Optional admin bootstrap (created at startup if username not present and password set)
app.admin.username=admin
app.admin.email=admin@example.com
app.admin.password=${ADMIN_PASSWORD:}

# This API has no file uploads. With multipart off, a multipart/form-data body gets a plain 415 instead of being parsed
# (a malformed one used to give HTTP 500).
spring.servlet.multipart.enabled=false

# Rate limiting (token buckets, in memory, per application instance). Each rule is "capacity" requests per "window",
# refilled continuously; a blocked client gets 429 with Retry-After and is let in again automatically. See README.md.
app.rate-limit.enabled=true
app.rate-limit.login-ip.capacity=5
app.rate-limit.login-ip.window=1m
app.rate-limit.login-username.capacity=5
app.rate-limit.login-username.window=1m
app.rate-limit.register-ip.capacity=5
app.rate-limit.register-ip.window=1h
app.rate-limit.password-user.capacity=5
app.rate-limit.password-user.window=15m
app.rate-limit.password-ip.capacity=5
app.rate-limit.password-ip.window=15m
app.rate-limit.money-user.capacity=30
app.rate-limit.money-user.window=1m
app.rate-limit.admin-user.capacity=120
app.rate-limit.admin-user.window=1m
app.rate-limit.global-ip.capacity=300
app.rate-limit.global-ip.window=1m
# Most keys (IPs / usernames / users) tracked per rule; least recently used are dropped first.
app.rate-limit.max-keys=50000
# Use the client address from X-Forwarded-For ONLY behind a reverse proxy that sets it and when the app is reachable
# only through that proxy; otherwise a client can forge the header and dodge the per-IP limits. trusted-proxies is the
# number of proxies in front of the app; the entry that many positions from the RIGHT of the header is the client.
app.rate-limit.trust-forwarded-headers=false
app.rate-limit.trusted-proxies=1
