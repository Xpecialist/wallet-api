spring.application.name=wallet-api

spring.datasource.url=jdbc:postgresql://localhost:5432/walletdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema is created from schema.sql; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Pagination: default page size, and the page size cap applied to the "size" request parameter
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# JWT: secret must be Base64 and at least 32 bytes decoded. Override via JWT_SECRET.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1kZXYtb25seS1zZWNyZXQtMTIzNDU2Nzg5MA==}
app.jwt.expiration-ms=3600000

# Starting balance for new wallets (dev convenience; set to 0 for real use)
app.wallet.initial-balance=100.00
app.wallet.currency=USD

# Optional admin bootstrap (created at startup if username not present and password set)
app.admin.username=admin
app.admin.email=admin@example.com
app.admin.password=${ADMIN_PASSWORD:}
