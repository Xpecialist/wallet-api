# LOCAL DEVELOPMENT ONLY. Active only with --spring.profiles.active=dev (never enabled by default).
# Publicly known JWT secret: anyone who reads this file can forge tokens. Never use this profile on a shared or real
# deployment; set JWT_SECRET there instead. JWT_SECRET still overrides this value when it is set.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1kZXYtb25seS1zZWNyZXQtMTIzNDU2Nzg5MA==}
# Listen on this machine only, because the secret above is public. To reach the dev server from another machine, set
# SERVER_ADDRESS=0.0.0.0 AND a private JWT_SECRET (Base64, at least 32 bytes decoded) so the public key cannot forge tokens.
server.address=${SERVER_ADDRESS:127.0.0.1}
